[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "A modular, safety-first desktop AI assistant."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "JARVIS Contributors" }]
dependencies = [
  "PySide6>=6.10,<7",
  "httpx>=0.28.1,<1",
  "keyring>=25.7,<27",
]

[project.optional-dependencies]
voice = ["pyttsx3>=2.99,<3"]
speech = ["SpeechRecognition>=3.17,<4"]
vision = ["Pillow>=11.3,<13"]
dev = ["pytest>=9,<10", "ruff>=0.14.7,<1"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/jarvis/ui/theme.py" = ["E501"]
